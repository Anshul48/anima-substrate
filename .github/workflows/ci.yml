name: ci
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build pytest ruff
      - run: python -m pip install -e .
      - run: python -m ruff check src tools/tests docs/examples
      - run: python -m ruff format --check src tools/tests docs/examples
      - run: python -m pytest tools/tests/ -q
      - run: python docs/examples/quickstart.py
      - run: python docs/examples/external_participant.py
      - run: python -m build
