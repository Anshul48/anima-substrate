<rect class="s-node" x="288" y="262" width="100" height="32" rx="10"/><text class="s-t" x="338" y="283">task 3</text>
<path class="s-line" d="M82 294v32M210 294v32M210 358v32M338 294v32"/>
<rect class="s-ok" x="32" y="326" width="100" height="32" rx="10"/><text class="s-g" x="82" y="347">right</text>
