<rect class="s-ok" x="160" y="390" width="100" height="32" rx="10"/><text class="s-g" x="210" y="411">fixed</text>
<rect class="s-wait" x="288" y="326" width="100" height="32" rx="10"/><text class="s-sm" x="338" y="347">waiting</text>
