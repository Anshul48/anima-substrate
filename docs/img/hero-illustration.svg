<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="hi-t hi-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="hi-t">Illustration: ANIMA between your coding tool and its memory</title>
<desc id="hi-d">Your coding tool at the top lists Muse Code first, then Claude Code, then Codex. One line plugs it into ANIMA below. Inside ANIMA a mission branches into three tasks. Task 1 is right, task 2 was wrong and a fix climbed one rung, task 3 is waiting. A memory hit, fixed this before with a source id, feeds the fix.</desc>
<style>
.s-box { fill: #101b38; stroke: #243255; stroke-width: 1.5; }
.s-anima { fill: none; stroke: #2fd6c2; stroke-width: 1.5; }
.s-node { fill: #0a1124; stroke: #a9b6d8; stroke-width: 1.5; }
.s-first { fill: #0a1124; stroke: #2fd6c2; stroke-width: 2.5; }
.s-ok { fill: #0a1124; stroke: #4be0a0; stroke-width: 2; }
.s-bad { fill: #0a1124; stroke: #f6b93b; stroke-width: 2; }
.s-wait { fill: none; stroke: #a9b6d8; stroke-width: 1.5; stroke-dasharray: 5 4; }
.s-mem { fill: #0a1124; stroke: #a597ff; stroke-width: 2; }
.s-line { fill: none; stroke: #a9b6d8; stroke-width: 1.5; }
.s-recall { fill: none; stroke: #a597ff; stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
.s-t { fill: #eef3ff; font-size: 14px; font-weight: 650; }
.s-cap { fill: #a9b6d8; font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; }
.s-sm { fill: #a9b6d8; font-size: 14px; }
.s-g { fill: #4be0a0; font-size: 14px; font-weight: 700; }
.s-a { fill: #f6b93b; font-size: 14px; font-weight: 700; }
.s-v { fill: #a597ff; font-size: 16px; font-weight: 700; }
.s-big { fill: #2fd6c2; font-size: 19px; font-weight: 800; letter-spacing: 0.2em; }
</style>
<rect width="420" height="560" rx="18" fill="#0a1124"/>
<g text-anchor="middle">
<rect class="s-box" x="10" y="8" width="400" height="98" rx="16"/>
<text class="s-cap" x="26" y="32" text-anchor="start">YOUR CODING TOOL</text>
<rect class="s-first" x="22" y="46" width="120" height="46" rx="10"/><text class="s-t" x="82" y="74">1 Muse Code</text>
<rect class="s-node" x="150" y="46" width="120" height="46" rx="10"/><text class="s-t" x="210" y="74">2 Claude Code</text>
<rect class="s-node" x="278" y="46" width="120" height="46" rx="10"/><text class="s-t" x="338" y="74">3 Codex</text>
<path class="s-line" d="M210 106v18"/><rect class="s-node" x="196" y="124" width="28" height="18" rx="4"/><path class="s-line" d="M203 142v10M217 142v10"/>
<text class="s-sm" x="236" y="138" text-anchor="start">one line</text>
<rect class="s-anima" x="10" y="152" width="400" height="398" rx="18"/>
<text class="s-big" x="30" y="186" text-anchor="start">ANIMA</text>
<rect class="s-node" x="162" y="198" width="96" height="32" rx="16"/><text class="s-t" x="210" y="219">mission</text>
<path class="s-line" d="M210 230v16M82 246h256M82 246v16M210 246v16M338 246v16"/>
